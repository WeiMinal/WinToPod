name: Windows build and checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Build and check
        shell: pwsh
        run: ./tools/Build.ps1 -WindowsSelfCheck
      - name: Check public files
        run: python tools/CheckSource.py
      - name: Package locally
        run: python tools/Package.py

<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>WinToPod 音画补偿</title>
<style>body{width:300px;padding:16px;font:14px 'Segoe UI',sans-serif;background:#f3f3f3;color:#202020}h2{font-size:18px;margin:0 0 12px}p{line-height:1.6}button{border:1px solid #ccc;background:white;padding:10px 14px;border-radius:5px;margin:4px 4px 4px 0}button:first-of-type{background:#0067c0;color:white;border:0}small{color:#666;line-height:1.5;display:block}@media(prefers-color-scheme:dark){body{background:#202020;color:#f4f4f4}button{background:#333;color:#f4f4f4;border-color:#555}small{color:#bbb}}</style>
<h2>WinToPod 音画补偿</h2><p id="status">正在检查连接……</p><p id="videoStatus"></p><button id="enable">为此网站启用</button><button id="disable">停用</button>
<p>B站安装后默认启用，无需填写延迟。音箱连接时自动补偿，断开后恢复原画面。</p><small>实验功能：普通网页视频；暂不支持受保护视频、画中画和视频原生全屏。处理画面会增加显卡或 CPU 开销。弹幕和页面字幕尚未一起延后。不会改变网站声音或控制 HomePod。</small><script src="popup.js"></script></html>

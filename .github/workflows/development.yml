# SPDX-License-Identifier: GPL-3.0-or-later
name: Development preview
on:
  push:
    branches: [development]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preview:
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - run: python tools/CheckSource.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check browser companion lifecycle
        run: node tests/video_sync_companion.mjs
      - name: Check browser popup states
        run: node tests/video_sync_popup.mjs
      - name: Build and validate Windows
        shell: pwsh
        run: ./tools/Build.ps1 -WindowsSelfCheck
      - run: python tools/Package.py --preview --output artifacts/preview
      - uses: actions/upload-artifact@v4
        with:
          name: WinToPod-V1.2-preview-${{ github.run_number }}
          path: artifacts/preview/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: preview-validation-${{ github.run_number }}
          path: artifacts/validation/
          if-no-files-found: ignore
  clock-aligned-native:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r tests/requirements.txt
      - name: Verify native stereo with ClockAligned
        run: python tests/v12_native_regression.py --output artifacts/clock-aligned-native
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: clock-aligned-native-${{ github.run_number }}
          path: artifacts/clock-aligned-native/
          if-no-files-found: warn

  global-sync-lab:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Check frame delay and lifetime
        shell: pwsh
        run: |
          dotnet run --project tests/WinToPod.GlobalSyncChecks -c Release
          if ($LASTEXITCODE -ne 0) { throw 'Frame delay checks failed' }
      - name: Build standalone global sync experiment
        shell: pwsh
        run: |
          dotnet publish src/WinToPod.GlobalSyncLab -c Release -r win-x64 --self-contained true -p:DebugType=None -p:DebugSymbols=false -m:1 -o artifacts/global-sync
          if ($LASTEXITCODE -ne 0) { throw 'Global sync build failed' }
          Copy-Item docs/GLOBAL-SYNC-LAB.md artifacts/global-sync/使用说明.md
          Copy-Item LICENSE artifacts/global-sync/LICENSE
      - uses: actions/upload-artifact@v4
        with:
          name: WinToPod-global-sync-lab-win-x64
          path: artifacts/global-sync/
          if-no-files-found: error
